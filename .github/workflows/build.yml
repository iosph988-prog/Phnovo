name: Build KeyBypass

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Theos tweak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ runner.temp }}/theos

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          zip_file="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [[ -z "$zip_file" ]]; then
            echo 'Nenhum arquivo .zip foi encontrado na raiz do repositório.' >&2
            exit 1
          fi

          rm -rf extracted build-project
          mkdir -p extracted build-project
          unzip -q "$zip_file" -d extracted

          makefile="$(find extracted -type f -name Makefile -print -quit)"
          if [[ -z "$makefile" ]]; then
            echo 'Nenhum Makefile foi encontrado dentro do ZIP.' >&2
            find extracted -maxdepth 4 -type f -print
            exit 1
          fi

          source_dir="$(dirname "$makefile")"
          cp -a "$source_dir"/. build-project/
          echo "Projeto encontrado em: $source_dir"
          find build-project -maxdepth 2 -type f -print

      - name: Build Debian package
        shell: bash
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build-project"
          make clean package FINALPACKAGE=1 DEBUG=0 THEOS="$THEOS"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: keybypass-deb
          path: build-project/packages/*.deb
          if-no-files-found: error
          retention-days: 14
